[workspace]
members = ["apps/namifl", "crates/namifl-core", "crates/namifl-adb"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# JPEG decode and pixel conversion must stay fast in development builds too.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
