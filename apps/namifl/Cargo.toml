[package]
name = "namifl"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
namifl-core = { path = "../../crates/namifl-core" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "system_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rfd = "0.17"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
dirs = "6"
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
